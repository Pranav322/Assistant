[project]
name = "rag-core"
version = "0.1.0"
description = "Standalone ingestion and retrieval service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.27",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "redis>=5.0.1",
    "dramatiq[redis]>=1.16.0",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "tiktoken>=0.6.0",
    "openai>=1.12.0",
    "pdfplumber>=0.10.4",
    "aiohttp>=3.9.3",
    "python-multipart>=0.0.9",
    "markdownify>=1.2.2",
    "aioboto3>=15.5.0",
    "greenlet>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]
