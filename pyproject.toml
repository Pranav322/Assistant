[project]
name = "rag-chatbot-platform"
version = "0.1.0"
description = "Universal RAG Chatbot Platform"
authors = [
    {name = "Pranav", email = "pranav@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.27",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "redis>=5.0.1",
    "dramatiq[redis]>=1.16.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "opentelemetry-instrumentation-redis>=0.44b0",
    "tiktoken>=0.6.0",
    "openai>=1.12.0",
    "pdfplumber>=0.10.4",
    "aiohttp>=3.9.3",
    "cryptography>=42.0.5",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.5.0",
    "passlib>=1.7.4",
    "argon2-cffi>=25.1.0",
    "bcrypt>=4.1.2",
    "markdownify>=1.2.2",
    "beautifulsoup4>=4.14.3",
    "aioboto3>=15.5.0",
    "nest-asyncio>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "types-redis>=4.6.0.20240106",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
ignore_missing_imports = true
