site_name: RAG Chatbot Platform
site_description: Production-ready RAG chatbot platform with hybrid search, semantic chunking, and widget integration
site_url: https://docs.example.com
repo_url: https://github.com/example/rag-prod
repo_name: example/rag-prod

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - autorefs

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Getting Started:
      - getting-started/index.md
      - getting-started/installation.md
      - getting-started/quickstart.md
      - getting-started/configuration.md
  - Guides:
      - guides/index.md
      - guides/widget-embedding.md
      - guides/api-keys.md
      - guides/authentication.md
  - API Reference:
      - api-reference/index.md
      - api-reference/authentication.md
      - api-reference/projects.md
      - api-reference/chat.md
      - api-reference/sources.md
  - Concepts:
      - concepts/architecture.md
      - concepts/retrieval-pipeline.md
      - concepts/security.md
  - Deployment:
      - deployment/index.md
      - deployment/docker.md
      - deployment/production.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/example/rag-prod
  generator: false

copyright: |
  &copy; 2026 RAG Chatbot Platform. All rights reserved.
